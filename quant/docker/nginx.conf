events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    client_max_body_size 50m;

    log_format compression '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $bytes_sent '
                       '"$http_referer" "$http_user_agent" "$gzip_ratio"';

    access_log /var/log/nginx/access.log compression buffer=32k;
    error_log /var/log/nginx/error.log warn;

    upstream backend_server {
        server backend:8000;
    }
    
    server {
        # 使用 8081 端口避免与另一个项目 (80/443) 冲突
        listen 8081;
        server_name 0vk.top;

        # 兼容上游未带尾部斜杠的访问
        location = /TrendZen {
            return 301 /TrendZen/;
        }

        # 所有的访问都带有 /TrendZen 前缀
        location /TrendZen/ {
            alias /usr/share/nginx/html/;
            index index.html;
            try_files $uri $uri/ /TrendZen/index.html;
        }

        # 后端 API 转发
        location /TrendZen/api {
            proxy_pass http://backend_server/api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 转发
        location /TrendZen/ws {
            proxy_pass http://backend_server/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 健康检查
        location /TrendZen/health {
            proxy_pass http://backend_server/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
