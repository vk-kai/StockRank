version: '3.8'

# StockRank 统一部署栈(合并 TrendZen 后,M1.4):
#   backend   Flask 主站(5000, 公网经 nginx /api)
#   quant     FastAPI 量化区(仅内网,nginx /quant/ 转发,统一门禁 QUANT_GATE_MODE=1)
#   nginx     80/443 单入口(/ 主站, /quant/ 量化区)
#   node-bridge Pi 隧道摆渡(host 网络, socat)
#   autoheal  容器自愈
# 旧 trendzen 独立栈(quant/docker/docker-compose.yml)由本文件取代。

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: a-stock-backend
    # init:true 用 tini 做 PID 1,负责把 SIGTERM 转发给 start.sh exec 起来的 python;
    # 否则 python 收不到停止信号→每次 down 都拖满 10 秒被 SIGKILL→CNI 端口规则清理被跳过
    # →残留 DNAT 遮蔽新规则→容器 Up 但端口不通(2026-09-06 事故根因之一)。
    init: true
    ports:
      - "5000:5000"
    environment:
      - THS_BROWSER_PATH=/usr/bin/chromium
      - MALLOC_ARENA_MAX=2          # 限制 glibc 内存 arena 数，减少多线程内存碎片（6个采集线程的 Python 进程预计降 200-400MB）
    mem_limit: 1200m                # 安全网：限制 backend 内存上限，防止失控拖垮系统（正常 600-816M，不会触及）
    shm_size: "512mb"
    volumes:
      - ../backend:/app/backend
      - ../config:/app/config
      - ../data:/app/data
      - ../logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  quant:
    build:
      context: ../quant
      dockerfile: docker/backend.Dockerfile
    container_name: a-stock-quant
    init: true
    # 不映射公网端口:仅 nginx 经 stock-network 内网转发(统一门禁第二道校验)
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # 统一门禁(gateway 模式):与 nginx 的 tz_gate SECRET 一致
      - QUANT_GATE_MODE=1
      - QUANT_GATE_SECRET=vK-TzGate-9f2c7a1e
      # 业务库路径:容器内 /app/backend 不是仓库布局,必须显式指向挂载卷
      # (与 Flask 容器的 ../data:/app/data 是同一个宿主机文件 /root/StockRank/data/stockrank.db)
      - QUANT_DB_PATH=/app/unified_data/stockrank.db
      # 容器网内直连 Flask(用容器名,podman 网络保证注册)
      - MARKET_MAP_PUSH_URL=http://a-stock-backend:5000/api/flow/market-map-push
    env_file:
      - ../quant/.env
    volumes:
      - ../quant/backend:/app/backend
      - ../quant/data:/app/data
      # 统一业务库:与 Flask 的 ../data 是同一个宿主机目录(WAL 并发安全)
      - ../data:/app/unified_data
      - ../logs/quant:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # Pi 节点隧道经 node-bridge 摆渡(host.containers.internal 指向网桥网关)
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    restart: unless-stopped
    labels:
      - autoheal=true
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  nginx:
    image: nginx:alpine
    container_name: a-stock-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../logs/nginx:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - backend
      - quant
    restart: unless-stopped
    networks:
      - stock-network

  # Pi 节点隧道摆渡：autossh 反向隧道因 sshd 加固（GatewayPorts no）只绑宿主机
  # 127.0.0.1:8765，bridge 网络里的容器经 host.docker.internal 敲不到 loopback。
  # 此容器用 host 网络在容器引擎的网桥网关地址上做 TCP 转发；
  # 只绑网段内地址，不监听 0.0.0.0，不暴露公网。
  # 网关 IP 因引擎而异：本服务器是 podman（docker0 不存在），已在 docker/.env
  # 用 DOCKER_GATEWAY_IP 固定；若是标准 Docker 则通常是 172.17.0.1。
  node-bridge:
    image: alpine/socat:latest
    container_name: a-stock-node-bridge
    network_mode: host
    command: "TCP-LISTEN:8765,bind=${DOCKER_GATEWAY_IP:-172.17.0.1},fork,reuseaddr TCP:127.0.0.1:8765"
    restart: always

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: a-stock-autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      # podman 环境:宿主机先 systemctl enable --now podman.socket 生成此 socket
      - /run/podman/podman.sock:/var/run/docker.sock
    restart: always
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge
