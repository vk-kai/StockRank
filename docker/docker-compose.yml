version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      network: host          # 构建期用宿主机网络：绕开 BuildKit bridge 的 DNS/IPv6 不通，解决 pip 连阿里源卡死
    container_name: a-stock-backend
    ports:
      - "5000:5000"
    environment:
      - THS_BROWSER_PATH=/usr/bin/chromium
      - MALLOC_ARENA_MAX=2          # 限制 glibc 内存 arena 数，减少多线程内存碎片（6个采集线程的 Python 进程预计降 200-400MB）
    mem_limit: 1200m                # 安全网：限制 backend 内存上限，防止失控拖垮系统（正常 600-816M，不会触及）
    shm_size: "512mb"
    volumes:
      - ../backend:/app/backend
      - ../config:/app/config
      - ../data:/app/data
      - ../logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: a-stock-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../logs/nginx:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge
