events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    client_max_body_size 20m;

    log_format compression '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $bytes_sent '
                       '"$http_referer" "$http_user_agent" "$gzip_ratio"';

    access_log /var/log/nginx/access.log compression buffer=32k;
    error_log /var/log/nginx/error.log warn;

    upstream backend_server {
        server backend:5000;
    }

    # 量化后端(quant, FastAPI),与 nginx 同在 stock-network,仅内网可达
    upstream quant_backend {
        server quant:8000;
    }

    # 量化区入口门禁：判定 ?tz_gate= 参数 与 tz_gate cookie 是否等于 SECRET
    # （只校验 location /quant/ 的静态入口；/quant/api 与 /quant/ws 由 quant 自身二次校验）
    map $arg_tz_gate $tz_arg_ok {
        default 0;
        "vK-TzGate-9f2c7a1e" 1;
    }
    map $http_cookie $tz_cookie_ok {
        default 0;
        "~tz_gate=vK-TzGate-9f2c7a1e" 1;
    }
    map "$tz_arg_ok$tz_cookie_ok" $tz_access_ok {
        default 0;
        "~1" 1;   # 任意一侧命中即放行
    }

    server {
        listen 80;
        server_name 0vk.top www.0vk.top;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name 0vk.top www.0vk.top;

        ssl_certificate /etc/letsencrypt/live/0vk.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/0vk.top/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000" always;

        # 旧 /TrendZen 路径整体 301 到 /quant(含 api/ws 深链)
        location = /TrendZen {
            return 301 /quant/;
        }

        location ^~ /TrendZen/ {
            rewrite ^/TrendZen/(.*)$ /quant/$1 permanent;
        }

        location = /quant {
            return 301 /quant/;
        }

        location ^~ /quant/ws/ {
            proxy_pass http://quant_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /quant/api/ {
            proxy_pass http://quant_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_max_temp_file_size 0;
        }

        location ^~ /quant/ {
            # 无 ?tz_gate= 参数也无 tz_gate cookie → 踢回首页，阻止直接复制 URL 访问
            if ($tz_access_ok = 0) {
                return 302 https://$host/;
            }
            # 由主站登录(或首次带 ?tz_gate= 进入)下发 cookie，使后续资源/刷新放行
            if ($tz_arg_ok = 1) {
                add_header Set-Cookie "tz_gate=vK-TzGate-9f2c7a1e; Path=/; Secure; HttpOnly; SameSite=Lax" always;
                # if 块内一旦声明 add_header，server 级 HSTS 便不再继承，此处补齐以保持一致
                add_header Strict-Transport-Security "max-age=63072000" always;
            }
            proxy_pass http://quant_backend/quant/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /socket.io/ {
            proxy_pass http://backend_server/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /api {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时设置（AI分析接口需要较长时间）
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_max_temp_file_size 0;
        }

        location /health {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            proxy_buffering off;
        }
    }
}
